name: "Ambientika MQTT Bridge"
description: "MQTT bridge for Ambientika ventilation units. Connects the Ambientika Cloud API to your local MQTT broker with Home Assistant Auto-Discovery support. Includes NeuraCell-X radon protection + dew-point control (Taupunktsteuerung)."
version: "1.4.0"
slug: "ambientika_mqtt_bridge"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
homeassistant_api: false
hassio_api: false
map:
  - config:rw
options:
  ambientika_username: ""
  ambientika_password: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: "ambientika"
  poll_interval: 30
  log_level: "INFO"
  # --- NeuraCell-X radon protection ---
  neuracell_enabled: true
  radon_topic: "ambientika/radon/value"
  radon_alarm_topic: "ambientika/radon/alarm"
  radon_threshold: 300
  radon_hysteresis: 50
  radon_protection_fan: "Low"
  radon_source: "signal"
  radon_device_serial: ""
  radon_device_alarm_field: "air_quality"
  radon_device_alarm_values: "Bad,Poor,Very Bad,Alarm,Alert"
  # --- Dew-point control (Taupunktsteuerung) - radon has priority ---
  dewpoint_enabled: true
  dewpoint_source: "signal"
  dewpoint_block_topic: "ambientika/dewpoint/block"
  dewpoint_block_devices: ""
  dewpoint_device_serial: ""
  dewpoint_device_block_modes: "Off"
  dewpoint_indoor_temp_topic: "ambientika/dewpoint/indoor_temp"
  dewpoint_indoor_humidity_topic: "ambientika/dewpoint/indoor_humidity"
  dewpoint_outdoor_temp_topic: "ambientika/dewpoint/outdoor_temp"
  dewpoint_outdoor_humidity_topic: "ambientika/dewpoint/outdoor_humidity"
  dewpoint_margin: 1.0
  dewpoint_hysteresis: 0.5
schema:
  ambientika_username: str
  ambientika_password: str
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: str?
  mqtt_topic_prefix: str
  poll_interval: int(10,300)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  # --- NeuraCell-X radon protection ---
  neuracell_enabled: bool
  radon_topic: str
  radon_alarm_topic: str?
  radon_threshold: int(50,1000)
  radon_hysteresis: int(0,500)
  radon_protection_fan: list(Low|Medium|High)
  radon_source: list(signal|device)
  radon_device_serial: str?
  radon_device_alarm_field: str?
  radon_device_alarm_values: str?
  # --- Dew-point control ---
  dewpoint_enabled: bool
  dewpoint_source: list(signal|computed|device)
  dewpoint_block_topic: str?
  dewpoint_block_devices: str?
  dewpoint_device_serial: str?
  dewpoint_device_block_modes: str?
  dewpoint_indoor_temp_topic: str?
  dewpoint_indoor_humidity_topic: str?
  dewpoint_outdoor_temp_topic: str?
  dewpoint_outdoor_humidity_topic: str?
  dewpoint_margin: float
  dewpoint_hysteresis: float
panel_icon: mdi:air-filter
panel_title: Ambientika
