# =====================================================================
# Ambientika - Home Assistant Paket Schlafetage + NeuraCell-X
# SUEDWIND - AIR SYSTEMS, www.ambientika.eu
#
# Einbindung (unveraendert):
#   configuration.yaml:
#     homeassistant:
#       packages: !include_dir_named packages
#   Diese Datei in den Ordner config/packages/ legen.
#   Danach: Entwicklerwerkzeuge > YAML > Konfiguration pruefen, neu starten.
#
# EINZIGE ANPASSUNG: die Liste "master_serials" im Skript unten.
#   Dort stehen die Seriennummern der MASTER-Geraete der Schlafetage, so wie
#   sie im Log der Bridge stehen, z. B. "Device: Eltern  (serial: 441BF633FDD4)".
#   Die Geraete werden ueber die Seriennummer gefunden, nicht ueber den Namen.
#   Umbenennen in der Ambientika-App oder in Home Assistant aendert nichts.
#   Slaves gehoeren NICHT in die Liste, sie folgen ihrem Master automatisch.
#
# Kontrolle: Entwicklerwerkzeuge > Aktionen > "Lüftung Schlafetage setzen",
#   Haken bei "nur_pruefen". Es erscheint eine Benachrichtigung mit den
#   gefundenen Geraeten, es werden keine Befehle gesendet.
#
# Radonvorrang:
#   Der Radonschutz laeuft in der Bridge (NeuraCell-X, ab 1.4.24 liest sie das
#   Ambientika Radon-Messgeraet im MQTT-Modus 4 direkt) und hat immer Vorrang.
#   Solange er aktiv ist, pausieren die Automationen hier.
# =====================================================================

# Uhrzeiten: "initial" gilt nach jedem Neustart. Wer die Zeiten im Dashboard
# dauerhaft aendern moechte, loescht nach dem ersten Start die "initial"-Zeilen,
# Home Assistant merkt sich dann den zuletzt eingestellten Wert.
input_datetime:
  lueftung_abend_werktag:
    name: "Lüftung Durchlüften Beginn (Mo-Fr)"
    has_date: false
    has_time: true
    initial: "20:30"
  lueftung_morgen_werktag:
    name: "Lüftung Tagbetrieb ab (Mo-Fr)"
    has_date: false
    has_time: true
    initial: "06:30"
  lueftung_abend_wochenende:
    name: "Lüftung Durchlüften Beginn (Sa-So)"
    has_date: false
    has_time: true
    initial: "21:30"
  lueftung_morgen_wochenende:
    name: "Lüftung Tagbetrieb ab (Sa-So)"
    has_date: false
    has_time: true
    initial: "08:00"

script:
  # Baustein: setzt Modus und Stufe fuer alle Master der Schlafetage.
  # Wird von den Automationen und dem Button aufgerufen. Direkt gestartet
  # nur zur Kontrolle mit "nur_pruefen".
  lueftung_schlafetage_setzen:
    alias: "Lüftung Schlafetage setzen"
    mode: queued
    fields:
      modus:
        description: "Smart, Auto, ManualHeatRecovery, Night, AwayHome, Surveillance, TimedExpulsion, Expulsion, Intake, MasterSlaveFlow (Pflicht, ausser bei nur_pruefen)"
        example: "ManualHeatRecovery"
        required: false
        selector:
          select:
            options: [Smart, Auto, ManualHeatRecovery, Night, AwayHome, Surveillance, TimedExpulsion, Expulsion, Intake, MasterSlaveFlow]
      stufe:
        description: "Low, Medium, High (Pflicht, ausser bei nur_pruefen)"
        example: "Low"
        required: false
        selector:
          select:
            options: [Low, Medium, High]
      nur_pruefen:
        description: "Nur anzeigen, welche Geräte gefunden werden, keine Befehle senden"
        required: false
        selector:
          boolean:
      snapshot_szene:
        description: "Vorher den aktuellen Betrieb in dieser Szene sichern (nutzt der Button)"
        example: "schlafetage_vorher"
        required: false
        selector:
          text:
    variables:
      # >>> HIER ANPASSEN: Seriennummern der Master-Geraete der Schlafetage,
      #     aus dem Log der Bridge: "Device: <Name>  (serial: <Seriennummer>)"
      master_serials: ["AABBCCDDEE01", "AABBCCDDEE02", "AABBCCDDEE03"]
      # Ab hier nichts aendern: sucht zu jeder Seriennummer die Auswahl-Entitaeten
      # "Mode" und "Fan Speed" des Geraets, unabhaengig von Namen und Entitaets-ID.
      master_info: >-
        {%- set wanted = master_serials | map('string') | map('upper') | list -%}
        {%- set ns = namespace(modus=[], stufe=[], found=[], names=[]) -%}
        {%- for e in integration_entities('mqtt') | sort if e.startswith('select.') -%}
          {%- set d = device_id(e) -%}
          {%- if d -%}
            {%- set idents = device_attr(d, 'identifiers') | string | upper -%}
            {%- set opts = state_attr(e, 'options') or [] -%}
            {%- for s in wanted if s in idents -%}
              {%- if 'MasterSlaveFlow' in opts -%}
                {%- set ns.modus = ns.modus + [e] -%}
                {%- set ns.found = ns.found + [s] -%}
                {%- set ns.names = ns.names + [(device_attr(d, 'name_by_user') or device_attr(d, 'name') or s) | string] -%}
              {%- elif opts | list == ['Low', 'Medium', 'High'] -%}
                {%- set ns.stufe = ns.stufe + [e] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'modus': ns.modus, 'stufe': ns.stufe, 'names': ns.names,
            'fehlend': wanted | reject('in', ns.found) | list} }}
      modus_entities: "{{ master_info.modus }}"
      stufe_entities: "{{ master_info.stufe }}"
    sequence:
      - if:
          - condition: template
            value_template: "{{ master_info.modus | count == 0 }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: ambientika_schlafetage_master
              title: "Ambientika Schlafetage"
              message: >-
                Kein Master-Gerät gefunden. Bitte die Seriennummern in der Liste
                master_serials im Skript "Lüftung Schlafetage setzen" prüfen
                (Log der Bridge: "Device: … (serial: …)").
                Gesucht: {{ master_info.fehlend | join(', ') }}
          - stop: "Kein Master-Gerät der Schlafetage gefunden – Seriennummern in master_serials prüfen."
            error: true
      - if:
          - condition: template
            value_template: "{{ nur_pruefen | default(false) | bool }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: ambientika_schlafetage_master
              title: "Ambientika Schlafetage – gefundene Master"
              message: >-
                {%- set ns = namespace(lines=[]) -%}
                {%- for n in master_info.names -%}
                  {%- set ns.lines = ns.lines + [n ~ ': ' ~ master_info.modus[loop.index0]] -%}
                {%- endfor -%}
                {%- if master_info.fehlend -%}
                  {%- set ns.lines = ns.lines + ['Nicht gefunden: ' ~ (master_info.fehlend | join(', '))] -%}
                {%- endif -%}
                {{ ns.lines | join('\n\n') }}
          - stop: "Nur Prüfung, es wurden keine Befehle gesendet."
      - if:
          - condition: template
            value_template: >-
              {{ modus is not defined or stufe is not defined
                 or modus not in ['Smart','Auto','ManualHeatRecovery','Night','AwayHome','Surveillance','TimedExpulsion','Expulsion','Intake','MasterSlaveFlow']
                 or stufe not in ['Low','Medium','High'] }}
        then:
          - stop: "Bitte Modus und Stufe angeben (Skript ist ein Baustein für Automationen und Button)."
            error: true
      - if:
          - condition: template
            value_template: "{{ snapshot_szene is defined and snapshot_szene | string | length > 0 }}"
        then:
          - service: scene.create
            data:
              scene_id: "{{ snapshot_szene }}"
              snapshot_entities: "{{ modus_entities + stufe_entities }}"
      - service: select.select_option
        target:
          entity_id: "{{ modus_entities }}"
        data:
          option: "{{ modus }}"
      - service: select.select_option
        target:
          entity_id: "{{ stufe_entities }}"
        data:
          option: "{{ stufe }}"

  # Button fuer alle Familienmitglieder: 20 Minuten kraeftig querlueften,
  # danach automatisch zurueck auf den vorherigen Betrieb.
  lueftung_schlafetage_stosslueften:
    alias: "Schlafetage 20 min durchlüften"
    icon: mdi:weather-windy
    mode: single
    sequence:
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
      # sichert den aktuellen Betrieb der Master in der Szene schlafetage_vorher
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: MasterSlaveFlow
          stufe: High
          snapshot_szene: schlafetage_vorher
      - delay: "00:20:00"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
      - service: scene.turn_on
        target:
          entity_id: scene.schlafetage_vorher

automation:
  # Vor dem Schlafengehen 30 min Querlueftung, danach die ganze Nacht
  # gleichmaessig Waermerueckgewinnung Stufe Low. Mo-Fr und Sa-So getrennt.
  - id: ambientika_schlafetage_abend
    alias: "Ambientika Schlafetage – Abend und Nacht"
    mode: restart
    trigger:
      - platform: time
        at: input_datetime.lueftung_abend_werktag
        id: werktag
      - platform: time
        at: input_datetime.lueftung_abend_wochenende
        id: wochenende
    condition:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: werktag
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: wochenende
              - condition: time
                weekday: [sat, sun]
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
    action:
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: MasterSlaveFlow
          stufe: High
      - delay: "00:30:00"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: ManualHeatRecovery
          stufe: Low

  # Morgens zurueck in den sensorgefuehrten SMART-Betrieb. Mo-Fr und Sa-So getrennt.
  - id: ambientika_schlafetage_morgen
    alias: "Ambientika Schlafetage – Tagbetrieb"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.lueftung_morgen_werktag
        id: werktag
      - platform: time
        at: input_datetime.lueftung_morgen_wochenende
        id: wochenende
    condition:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: werktag
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: wochenende
              - condition: time
                weekday: [sat, sun]
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
    action:
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: Smart
          stufe: Medium

  # Hinweis aufs Handy, wenn das Radon-Messgeraet laenger als 20 Minuten keine
  # Verbindung hat (ab Bridge 1.4.25). Solange es offline ist, arbeitet der
  # Radonschutz ohne aktuellen Messwert.
  - id: ambientika_radon_messgeraet_offline
    alias: "Ambientika NeuraCell-X – Radon-Messgerät offline"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_meter_connected
        to: "off"
        for: "00:20:00"
    action:
      - service: notify.notify
        data:
          title: "NeuraCell-X"
          message: >
            Das Radon-Messgerät ist seit 20 Minuten nicht verbunden. Bitte kurz
            vom Strom nehmen und wieder einstecken.

  # Hinweis aufs Handy, wenn die Taupunktsteuerung laenger als 20 Minuten keine
  # Verbindung hat (ab Bridge 1.4.26, braucht in der Bridge
  # dewpoint_availability_topic oder dewpoint_signal_timeout). Solange sie
  # offline ist, gilt fuer die Sperre im Keller dewpoint_lost_action.
  - id: ambientika_taupunktsteuerung_offline
    alias: "Ambientika NeuraCell-X – Taupunktsteuerung offline"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_dew_point_controller_connected
        to: "off"
        for: "00:20:00"
    action:
      - service: notify.notify
        data:
          title: "NeuraCell-X"
          message: >
            Die Taupunktsteuerung ist seit 20 Minuten nicht verbunden. Bitte kurz
            vom Strom nehmen und wieder einstecken.

  # Hinweis aufs Handy, wenn der Radonschutz anspringt bzw. endet.
  - id: ambientika_radon_hinweis
    alias: "Ambientika NeuraCell-X – Radonschutz Hinweis"
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_protection_active
        from: "off"
        to: "on"
        id: "an"
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_protection_active
        from: "on"
        to: "off"
        id: "aus"
    action:
      - service: notify.notify
        data:
          title: "NeuraCell-X"
          message: >
            {% if trigger.id == 'an' %}
            Radonschutz aktiv ({{ states('sensor.neuracell_x_radon_level') }} Bq/m³) – alle Geräte laufen in Zuluft.
            {% else %}
            Radonwert wieder im grünen Bereich – Lüftung läuft wie vorher.
            {% endif %}
