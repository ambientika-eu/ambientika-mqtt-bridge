# =====================================================================
# Ambientika - Home Assistant Paket Schlafetage + NeuraCell-X
# SUEDWIND - AIR SYSTEMS, www.ambientika.eu
#
# Einbindung (unveraendert):
#   configuration.yaml:
#     homeassistant:
#       packages: !include_dir_named packages
#   Diese Datei in den Ordner config/packages/ legen.
#   Danach: Entwicklerwerkzeuge > YAML > Konfiguration pruefen, neu starten.
#
# ANPASSUNG 1: die Liste "master_serials" im Skript "Lüftung Schlafetage setzen".
#   Dort stehen die Seriennummern der MASTER-Geraete der Schlafetage, so wie
#   sie im Log der Bridge stehen, z. B. "Device: Eltern  (serial: 441BF633FDD4)".
#   Die Geraete werden ueber die Seriennummer gefunden, nicht ueber den Namen.
#   Umbenennen in der Ambientika-App oder in Home Assistant aendert nichts.
#   Slaves gehoeren NICHT in die Liste, sie folgen ihrem Master automatisch.
#
# ANPASSUNG 2 (optional, Selbstheilung): die beiden Steckdosen im Skript
#   "Ambientika Gerät über Steckdose neu starten". Haengen Radon-Messgeraet und
#   Taupunktsteuerung an je einer schaltbaren Steckdose, startet das Paket das
#   Geraet automatisch neu, wenn es 10 Minuten nicht verbunden ist (kurz aus,
#   10 s warten, wieder an) - hoechstens einmal pro Stunde. Einschalten im
#   Dashboard: "Radon-Messgerät automatisch neu starten" bzw.
#   "Taupunktsteuerung automatisch neu starten". Solange ein Schalter an ist,
#   schaltet Home Assistant die zugehoerige Steckdose wieder ein, falls sie
#   laenger als 2 Minuten aus bleibt (Waechter) - zum Warten also zuerst den
#   Schalter aus.
#
# Kontrolle: Entwicklerwerkzeuge > Aktionen > "Lüftung Schlafetage setzen",
#   Haken bei "nur_pruefen". Es erscheint eine Benachrichtigung mit den
#   gefundenen Geraeten, es werden keine Befehle gesendet. Fuer die Steckdosen
#   genauso: "Ambientika Gerät über Steckdose neu starten", geraet "radon"
#   bzw. "taupunkt", Haken bei "nur_pruefen".
#
# Radonvorrang:
#   Der Radonschutz laeuft in der Bridge (NeuraCell-X, ab 1.4.24 liest sie das
#   Ambientika Radon-Messgeraet im MQTT-Modus 4 direkt) und hat immer Vorrang.
#   Solange er aktiv ist, pausieren die Automationen hier.
# =====================================================================

# Uhrzeiten: "initial" gilt nach jedem Neustart. Wer die Zeiten im Dashboard
# dauerhaft aendern moechte, loescht nach dem ersten Start die "initial"-Zeilen,
# Home Assistant merkt sich dann den zuletzt eingestellten Wert.
input_datetime:
  lueftung_abend_werktag:
    name: "Lüftung Durchlüften Beginn (Mo-Fr)"
    has_date: false
    has_time: true
    initial: "20:30"
  lueftung_morgen_werktag:
    name: "Lüftung Tagbetrieb ab (Mo-Fr)"
    has_date: false
    has_time: true
    initial: "06:30"
  lueftung_abend_wochenende:
    name: "Lüftung Durchlüften Beginn (Sa-So)"
    has_date: false
    has_time: true
    initial: "21:30"
  lueftung_morgen_wochenende:
    name: "Lüftung Tagbetrieb ab (Sa-So)"
    has_date: false
    has_time: true
    initial: "08:00"
  # Selbstheilung: Datum des letzten Zaehler-Resets (kein "initial", bleibt erhalten).
  ambientika_neustart_zaehler_datum:
    name: "Neustart-Zähler zuletzt zurückgesetzt"
    has_date: true
    has_time: false

# Selbstheilung: Schalter im Dashboard (nach dem Eintragen der Steckdosen
# einschalten) und Zaehler der automatischen Neustarts des Tages.
input_boolean:
  ambientika_neustart_radon:
    name: "Radon-Messgerät automatisch neu starten"
    icon: mdi:restart
  ambientika_neustart_taupunkt:
    name: "Taupunktsteuerung automatisch neu starten"
    icon: mdi:restart

counter:
  ambientika_neustarts_radon:
    name: "Neustarts Radon-Messgerät heute"
    icon: mdi:restart-alert
    restore: true
  ambientika_neustarts_taupunkt:
    name: "Neustarts Taupunktsteuerung heute"
    icon: mdi:restart-alert
    restore: true

script:
  # Baustein: setzt Modus und Stufe fuer alle Master der Schlafetage.
  # Wird von den Automationen und dem Button aufgerufen. Direkt gestartet
  # nur zur Kontrolle mit "nur_pruefen".
  lueftung_schlafetage_setzen:
    alias: "Lüftung Schlafetage setzen"
    mode: queued
    fields:
      modus:
        description: "Smart, Auto, ManualHeatRecovery, Night, AwayHome, Surveillance, TimedExpulsion, Expulsion, Intake, MasterSlaveFlow (Pflicht, ausser bei nur_pruefen)"
        example: "ManualHeatRecovery"
        required: false
        selector:
          select:
            options: [Smart, Auto, ManualHeatRecovery, Night, AwayHome, Surveillance, TimedExpulsion, Expulsion, Intake, MasterSlaveFlow]
      stufe:
        description: "Low, Medium, High (Pflicht, ausser bei nur_pruefen)"
        example: "Low"
        required: false
        selector:
          select:
            options: [Low, Medium, High]
      nur_pruefen:
        description: "Nur anzeigen, welche Geräte gefunden werden, keine Befehle senden"
        required: false
        selector:
          boolean:
      snapshot_szene:
        description: "Vorher den aktuellen Betrieb in dieser Szene sichern (nutzt der Button)"
        example: "schlafetage_vorher"
        required: false
        selector:
          text:
    variables:
      # >>> HIER ANPASSEN: Seriennummern der Master-Geraete der Schlafetage,
      #     aus dem Log der Bridge: "Device: <Name>  (serial: <Seriennummer>)"
      master_serials: ["AABBCCDDEE01", "AABBCCDDEE02", "AABBCCDDEE03"]
      # Ab hier nichts aendern: sucht zu jeder Seriennummer die Auswahl-Entitaeten
      # "Mode" und "Fan Speed" des Geraets, unabhaengig von Namen und Entitaets-ID.
      # Erkennung ueber die Optionen: "Mode" enthaelt MasterSlaveFlow; "Fan Speed"
      # enthaelt Low und High, aber kein Smart. Die Liste von "Fan Speed" darf
      # laenger sein als Low/Medium/High - die Bridge zeigt dort auch die vom
      # Geraet selbst gewaehlten Stufen Night und Turbo an (nur lesbar). Ein
      # Vergleich auf genau drei Eintraege fand die Entitaet deshalb nicht, und
      # das Skript setzte nur den Modus - die Stufe blieb dem Geraet ueberlassen.
      master_info: >-
        {%- set wanted = master_serials | map('string') | map('upper') | list -%}
        {%- set sel = integration_entities('mqtt') | sort | list -%}
        {%- set ns = namespace(modus=[], stufe=[], found=[], names=[], ohne_stufe=[]) -%}
        {%- for s in wanted -%}
          {%- set m = namespace(modus=none, stufe=none, name=s) -%}
          {%- for e in sel if e.startswith('select.') -%}
            {%- set d = device_id(e) -%}
            {%- if d and s in (device_attr(d, 'identifiers') | string | upper) -%}
              {%- set opts = state_attr(e, 'options') or [] -%}
              {%- if 'MasterSlaveFlow' in opts -%}
                {%- set m.modus = e -%}
                {%- set m.name = (device_attr(d, 'name_by_user') or device_attr(d, 'name') or s) | string -%}
              {%- elif 'Low' in opts and 'High' in opts and 'Smart' not in opts -%}
                {%- set m.stufe = e -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if m.modus -%}
            {%- set ns.found = ns.found + [s] -%}
            {%- if m.stufe -%}
              {%- set ns.modus = ns.modus + [m.modus] -%}
              {%- set ns.stufe = ns.stufe + [m.stufe] -%}
              {%- set ns.names = ns.names + [m.name] -%}
            {%- else -%}
              {%- set ns.ohne_stufe = ns.ohne_stufe + [m.name] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'modus': ns.modus, 'stufe': ns.stufe, 'names': ns.names, 'ohne_stufe': ns.ohne_stufe,
            'fehlend': wanted | reject('in', ns.found) | list} }}
      modus_entities: "{{ master_info.modus }}"
      stufe_entities: "{{ master_info.stufe }}"
    sequence:
      - if:
          - condition: template
            value_template: "{{ nur_pruefen | default(false) | bool(true) }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: ambientika_schlafetage_master
              title: "Ambientika Schlafetage – gefundene Master"
              message: >-
                {%- set ns = namespace(lines=[]) -%}
                {%- for n in master_info.names -%}
                  {%- set ns.lines = ns.lines + [n ~ ': ' ~ master_info.modus[loop.index0] ~ ' + ' ~ master_info.stufe[loop.index0]] -%}
                {%- endfor -%}
                {%- if master_info.ohne_stufe -%}
                  {%- set ns.lines = ns.lines + ['Ohne Auswahl „Fan Speed" (wird nicht geschaltet): ' ~ (master_info.ohne_stufe | join(', '))] -%}
                {%- endif -%}
                {%- if master_info.fehlend -%}
                  {%- set ns.lines = ns.lines + ['Nicht gefunden: ' ~ (master_info.fehlend | join(', '))] -%}
                {%- endif -%}
                {%- if not ns.lines -%}
                  {%- set ns.lines = ['Kein Gerät gefunden.'] -%}
                {%- endif -%}
                {{ ns.lines | join('\n\n') }}
          - stop: "Nur Prüfung, es wurden keine Befehle gesendet."
      - if:
          - condition: template
            value_template: "{{ master_info.modus | count == 0 }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: ambientika_schlafetage_master
              title: "Ambientika Schlafetage"
              message: >-
                Kein Master-Gerät gefunden. Bitte die Seriennummern in der Liste
                master_serials im Skript "Lüftung Schlafetage setzen" prüfen
                (Log der Bridge: "Device: … (serial: …)").
                Gesucht: {{ master_info.fehlend | join(', ') }}
                {%- if master_info.ohne_stufe %}
                Gefunden, aber ohne Auswahl „Fan Speed": {{ master_info.ohne_stufe | join(', ') }}
                – Add-on aktualisieren und Home Assistant neu starten.
                {%- endif %}
          - stop: "Kein Master-Gerät der Schlafetage gefunden – Seriennummern in master_serials prüfen."
            error: true
      # Ein Master ohne Auswahl "Fan Speed" wuerde nur den Modus bekommen und die
      # Stufe dem Geraet ueberlassen. Lieber gar nicht schalten und Bescheid sagen.
      - if:
          - condition: template
            value_template: "{{ master_info.ohne_stufe | count > 0 }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: ambientika_schlafetage_master
              title: "Ambientika Schlafetage"
              message: >-
                Für {{ master_info.ohne_stufe | join(', ') }} wurde die Auswahl
                „Fan Speed" nicht gefunden, es wurde nichts geschaltet. Bitte das
                Add-on aktualisieren und Home Assistant neu starten; zur Kontrolle
                das Skript mit "nur_pruefen" starten.
          - stop: "Auswahl Fan Speed fehlt – es wurde nichts geschaltet."
            error: true
      - if:
          - condition: template
            value_template: >-
              {{ modus is not defined or stufe is not defined
                 or modus not in ['Smart','Auto','ManualHeatRecovery','Night','AwayHome','Surveillance','TimedExpulsion','Expulsion','Intake','MasterSlaveFlow']
                 or stufe not in ['Low','Medium','High'] }}
        then:
          - stop: "Bitte Modus und Stufe angeben (Skript ist ein Baustein für Automationen und Button)."
            error: true
      - if:
          - condition: template
            value_template: "{{ snapshot_szene is defined and snapshot_szene | string | length > 0 }}"
        then:
          - service: scene.create
            data:
              scene_id: "{{ snapshot_szene }}"
              snapshot_entities: "{{ modus_entities + stufe_entities }}"
      - service: select.select_option
        target:
          entity_id: "{{ modus_entities }}"
        data:
          option: "{{ modus }}"
      - service: select.select_option
        target:
          entity_id: "{{ stufe_entities }}"
        data:
          option: "{{ stufe }}"

  # Button fuer alle Familienmitglieder: 20 Minuten kraeftig querlueften,
  # danach automatisch zurueck auf den vorherigen Betrieb.
  lueftung_schlafetage_stosslueften:
    alias: "Schlafetage 20 min durchlüften"
    icon: mdi:weather-windy
    mode: single
    sequence:
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
      # sichert den aktuellen Betrieb der Master in der Szene schlafetage_vorher
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: MasterSlaveFlow
          stufe: High
          snapshot_szene: schlafetage_vorher
      - delay: "00:20:00"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
      - service: scene.turn_on
        target:
          entity_id: scene.schlafetage_vorher

  # Selbstheilung: ein Geraet ueber seine Steckdose neu starten (kurz aus,
  # warten, wieder an). Wird von den Automationen unten aufgerufen; zum
  # Ausprobieren auch von Hand ueber die beiden Skripte "... jetzt neu starten".
  ambientika_geraet_neu_starten:
    alias: "Ambientika Gerät über Steckdose neu starten"
    icon: mdi:restart
    mode: queued
    fields:
      geraet:
        description: "radon = Radon-Messgerät, taupunkt = Taupunktsteuerung"
        example: "radon"
        required: true
        selector:
          select:
            options: [radon, taupunkt]
      nur_pruefen:
        description: "Nur prüfen, ob die Steckdose gefunden wird, nicht schalten"
        required: false
        selector:
          boolean:
      automatisch:
        description: "Von der Automation gesetzt: zählt den Neustart und meldet den ersten des Tages aufs Handy"
        required: false
        selector:
          boolean:
    variables:
      # >>> HIER ANPASSEN: die Steckdosen der beiden Geraete, als Entitaets-ID
      #     des Schalters in Home Assistant (Einstellungen > Geraete & Dienste >
      #     Entitaeten, z. B. switch.fritz_dect_200_1 oder switch.shelly_plug_s_keller).
      #     Die Marken (&steckdose_...) stehen lassen, der Waechter unten nutzt sie.
      steckdosen:
        radon: &steckdose_radon switch.steckdose_radon_messgeraet
        taupunkt: &steckdose_taupunkt switch.steckdose_taupunktsteuerung
      # Sekunden ohne Strom beim Neustart.
      aus_sekunden: 10
      # Ab hier nichts aendern.
      namen:
        radon: "Radon-Messgerät"
        taupunkt: "Taupunktsteuerung"
      zaehler:
        radon: counter.ambientika_neustarts_radon
        taupunkt: counter.ambientika_neustarts_taupunkt
      schalter:
        radon: input_boolean.ambientika_neustart_radon
        taupunkt: input_boolean.ambientika_neustart_taupunkt
      sensoren:
        radon: binary_sensor.neuracell_x_radon_meter_connected
        taupunkt: binary_sensor.neuracell_x_dew_point_controller_connected
      welches: "{{ geraet | default('') | string | lower | trim }}"
      steckdose: "{{ steckdosen.get(welches, '') }}"
      name: "{{ namen.get(welches, welches) }}"
      auto: "{{ automatisch | default(false) | bool(false) }}"
    sequence:
      - if:
          - condition: template
            value_template: "{{ steckdose | length == 0 }}"
        then:
          - stop: "Bitte geraet angeben: radon oder taupunkt."
            error: true
      # Direkt nach einem Neustart von Home Assistant kennt manche Integration den
      # Zustand der Steckdose erst nach einem Moment.
      - wait_template: "{{ states(steckdose) not in ['unknown', 'unavailable'] }}"
        timeout: "00:01:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ states(steckdose) in ['unknown', 'unavailable'] }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: "ambientika_steckdose_{{ welches }}"
              title: "Ambientika Selbstheilung"
              message: >-
                {%- if states[steckdose] is none -%}
                Die Steckdose {{ steckdose }} für {{ name }} gibt es in Home Assistant
                nicht. Bitte die Entitäts-ID im Skript "Ambientika Gerät über Steckdose
                neu starten" prüfen oder den Schalter "{{ name }} automatisch neu
                starten" ausschalten.
                {%- else -%}
                Die Steckdose {{ steckdose }} für {{ name }} ist nicht erreichbar
                (Zustand: {{ states(steckdose) }}). Es wurde nicht geschaltet. Bitte
                Steckdose und deren Integration prüfen.
                {%- endif %}
          - stop: "Steckdose nicht gefunden oder nicht erreichbar (siehe Benachrichtigung)."
            error: true
      - if:
          - condition: template
            value_template: "{{ nur_pruefen | default(false) | bool(true) }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: "ambientika_steckdose_{{ welches }}"
              title: "Ambientika Selbstheilung – Prüfung"
              message: >-
                {{ name }}: Steckdose {{ steckdose }} gefunden, Zustand "{{ states(steckdose) }}".
                Automatischer Neustart: {{ 'ein' if is_state(schalter[welches], 'on') else 'aus' }}
                ({{ schalter[welches] }}). Neustarts heute: {{ states(zaehler[welches]) }}.
                Verbindung laut Bridge: {{ states(sensoren[welches]) }}.
          - stop: "Nur Prüfung, es wurde nicht geschaltet."
      # Automatisch: nicht mehr neu starten, wenn das Geraet inzwischen zurueck ist
      # (z. B. wenn der Neustart in der Warteschlange stand).
      - if:
          - condition: template
            value_template: "{{ auto and is_state(sensoren[welches], 'on') }}"
        then:
          - stop: "Gerät ist inzwischen wieder verbunden, kein Neustart nötig."
      - service: homeassistant.turn_off
        target:
          entity_id: "{{ steckdose }}"
        continue_on_error: true
      # Erst wenn die Steckdose "aus" meldet, zaehlt der Neustart.
      - wait_template: "{{ is_state(steckdose, 'off') }}"
        timeout: "00:00:10"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not is_state(steckdose, 'off') }}"
        then:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ steckdose }}"
            continue_on_error: true
          - service: persistent_notification.create
            data:
              notification_id: "ambientika_steckdose_{{ welches }}"
              title: "Ambientika Selbstheilung"
              message: >-
                Die Steckdose {{ steckdose }} für {{ name }} ließ sich nicht ausschalten
                (Zustand: {{ states(steckdose) }}), kein Neustart. Bitte Steckdose und
                deren Integration prüfen.
          - stop: "Steckdose meldet nicht 'aus', kein Neustart (siehe Benachrichtigung)."
            error: true
      - delay:
          seconds: "{{ aus_sekunden | int(10) }}"
      # Wieder einschalten, zur Sicherheit bis zu dreimal, bis die Steckdose "an" meldet.
      - repeat:
          sequence:
            - service: homeassistant.turn_on
              target:
                entity_id: "{{ steckdose }}"
              continue_on_error: true
            - wait_template: "{{ is_state(steckdose, 'on') }}"
              timeout: "00:00:05"
              continue_on_timeout: true
          until:
            - condition: template
              value_template: "{{ is_state(steckdose, 'on') or repeat.index >= 3 }}"
      # Manche Integration meldet den Zustand erst mit Verzoegerung.
      - wait_template: "{{ is_state(steckdose, 'on') }}"
        timeout: "00:00:20"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not is_state(steckdose, 'on') }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: "ambientika_steckdose_{{ welches }}"
              title: "Ambientika Selbstheilung – Achtung"
              message: >-
                Die Steckdose {{ steckdose }} für {{ name }} meldet nach dem Neustart
                nicht "an" (Zustand: {{ states(steckdose) }}). Bitte sofort prüfen und
                von Hand einschalten.
          - service: notify.notify
            continue_on_error: true
            data:
              title: "NeuraCell-X – Achtung"
              message: >-
                Die Steckdose für {{ name }} meldet nach dem automatischen Neustart nicht
                "an" ({{ steckdose }}: {{ states(steckdose) }}). Bitte sofort prüfen und von
                Hand einschalten.
          - stop: "Steckdose meldet nach dem Neustart nicht 'an' (siehe Benachrichtigung)."
            error: true
      # Von Hand gestartet: nur eine Benachrichtigung in Home Assistant, nicht gezaehlt.
      - if:
          - condition: template
            value_template: "{{ not auto }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: "ambientika_steckdose_{{ welches }}"
              title: "Ambientika Selbstheilung"
              message: >-
                {{ name }}: Neustart von Hand ausgeführt, die Steckdose {{ steckdose }}
                war {{ aus_sekunden | int(10) }} s aus und ist wieder an.
          - stop: "Neustart von Hand ausgeführt."
      - service: counter.increment
        target:
          entity_id: "{{ zaehler[welches] }}"
      # Eine Nachricht aufs Handy nur beim ersten automatischen Neustart des Tages;
      # die weiteren zaehlt der Zaehler im Dashboard. Hilft ein Neustart nicht,
      # meldet sich die Automation "... offline" nach 20 Minuten ohne Verbindung.
      - if:
          - condition: template
            value_template: "{{ states(zaehler[welches]) | int(0) == 1 }}"
        then:
          - service: notify.notify
            continue_on_error: true
            data:
              title: "NeuraCell-X"
              message: >-
                {{ name }} war nicht mehr verbunden und wurde automatisch über die
                Steckdose neu gestartet. Weitere Neustarts heute zählt
                "{{ state_attr(zaehler[welches], 'friendly_name') }}" im Dashboard;
                eine Nachricht kommt nur, wenn ein Neustart nicht hilft.

  ambientika_radon_messgeraet_neu_starten:
    alias: "Radon-Messgerät jetzt neu starten"
    icon: mdi:restart
    mode: single
    max_exceeded: silent
    sequence:
      - service: script.ambientika_geraet_neu_starten
        data:
          geraet: radon

  ambientika_taupunktsteuerung_neu_starten:
    alias: "Taupunktsteuerung jetzt neu starten"
    icon: mdi:restart
    mode: single
    max_exceeded: silent
    sequence:
      - service: script.ambientika_geraet_neu_starten
        data:
          geraet: taupunkt

automation:
  # Vor dem Schlafengehen 30 min Querlueftung, danach die ganze Nacht
  # gleichmaessig Waermerueckgewinnung Stufe Low. Mo-Fr und Sa-So getrennt.
  - id: ambientika_schlafetage_abend
    alias: "Ambientika Schlafetage – Abend und Nacht"
    mode: restart
    trigger:
      - platform: time
        at: input_datetime.lueftung_abend_werktag
        id: werktag
      - platform: time
        at: input_datetime.lueftung_abend_wochenende
        id: wochenende
    condition:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: werktag
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: wochenende
              - condition: time
                weekday: [sat, sun]
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
    action:
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: MasterSlaveFlow
          stufe: High
      - delay: "00:30:00"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: ManualHeatRecovery
          stufe: Low

  # Morgens zurueck in den sensorgefuehrten SMART-Betrieb. Mo-Fr und Sa-So getrennt.
  - id: ambientika_schlafetage_morgen
    alias: "Ambientika Schlafetage – Tagbetrieb"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.lueftung_morgen_werktag
        id: werktag
      - platform: time
        at: input_datetime.lueftung_morgen_wochenende
        id: wochenende
    condition:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: werktag
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: wochenende
              - condition: time
                weekday: [sat, sun]
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.neuracell_x_radon_protection_active
            state: "on"
    action:
      - service: script.lueftung_schlafetage_setzen
        data:
          modus: Smart
          stufe: Medium

  # Hinweis aufs Handy, wenn das Radon-Messgeraet laenger als 20 Minuten keine
  # Verbindung hat (ab Bridge 1.4.25; ab 1.4.27 auch, wenn es nur still wird
  # oder beim Neustart des Add-ons schon weg war). Solange es offline ist,
  # arbeitet der Radonschutz ohne aktuellen Messwert.
  - id: ambientika_radon_messgeraet_offline
    alias: "Ambientika NeuraCell-X – Radon-Messgerät offline"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_meter_connected
        to: "off"
        for: "00:20:00"
    action:
      - service: notify.notify
        data:
          title: "NeuraCell-X"
          message: >
            {%- set a = state_attr('automation.ambientika_neuracell_x_radon_messgerat_automatisch_neu_starten', 'last_triggered') %}
            {%- set seit = states.binary_sensor.neuracell_x_radon_meter_connected.last_changed %}
            Das Radon-Messgerät ist seit 20 Minuten nicht verbunden.
            {%- if is_state('input_boolean.ambientika_neustart_radon', 'on') and a is not none and a > seit %} Der
            automatische Neustart über die Steckdose hat nicht geholfen – bitte Gerät
            und Steckdose prüfen.
            {%- elif is_state('input_boolean.ambientika_neustart_radon', 'on') %} Der
            automatische Neustart über die Steckdose steht noch aus (Sperrzeit) oder
            war nicht möglich – siehe Benachrichtigungen in Home Assistant.
            {%- else %} Bitte kurz vom Strom nehmen und wieder einstecken.
            {%- endif %}

  # Hinweis aufs Handy, wenn die Taupunktsteuerung laenger als 20 Minuten keine
  # Verbindung hat (ab Bridge 1.4.26; die Ambientika-Taupunktsteuerung wird ab
  # 1.4.27 automatisch ueberwacht, andere brauchen in der Bridge
  # dewpoint_availability_topic oder dewpoint_signal_timeout). Solange sie
  # offline ist, gilt fuer die Sperre im Keller dewpoint_lost_action.
  - id: ambientika_taupunktsteuerung_offline
    alias: "Ambientika NeuraCell-X – Taupunktsteuerung offline"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_dew_point_controller_connected
        to: "off"
        for: "00:20:00"
    action:
      - service: notify.notify
        data:
          title: "NeuraCell-X"
          message: >
            {%- set a = state_attr('automation.ambientika_neuracell_x_taupunktsteuerung_automatisch_neu_starten', 'last_triggered') %}
            {%- set seit = states.binary_sensor.neuracell_x_dew_point_controller_connected.last_changed %}
            Die Taupunktsteuerung ist seit 20 Minuten nicht verbunden.
            {%- if is_state('input_boolean.ambientika_neustart_taupunkt', 'on') and a is not none and a > seit %} Der
            automatische Neustart über die Steckdose hat nicht geholfen – bitte Gerät
            und Steckdose prüfen.
            {%- elif is_state('input_boolean.ambientika_neustart_taupunkt', 'on') %} Der
            automatische Neustart über die Steckdose steht noch aus (Sperrzeit) oder
            war nicht möglich – siehe Benachrichtigungen in Home Assistant.
            {%- else %} Bitte kurz vom Strom nehmen und wieder einstecken.
            {%- endif %}

  # Selbstheilung: Radon-Messgeraet nach 10 Minuten ohne Verbindung ueber die
  # Steckdose neu starten, hoechstens einmal pro Stunde. Kommt es danach nicht
  # zurueck, wird alle 30 Minuten geprueft und nach Ablauf der Stunde erneut
  # neu gestartet; die Automation "... offline" oben meldet den Fehlschlag.
  - id: ambientika_radon_messgeraet_neustart
    alias: "Ambientika NeuraCell-X – Radon-Messgerät automatisch neu starten"
    mode: single
    trace:
      stored_traces: 25
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_meter_connected
        to: "off"
        for: "00:10:00"
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.ambientika_neustart_radon
        state: "on"
      - condition: template
        value_template: "{{ has_value('binary_sensor.neuracell_x_radon_meter_connected') }}"
      - condition: state
        entity_id: binary_sensor.neuracell_x_radon_meter_connected
        state: "off"
        for: "00:09:30"
      # Sperrzeit: hoechstens ein Neustart pro Stunde (3540 s, damit der
      # 30-Minuten-Takt die volle Stunde nicht um Sekundenbruchteile verpasst).
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 3540 }}
    action:
      - service: script.ambientika_geraet_neu_starten
        data:
          geraet: radon
          automatisch: true

  # Selbstheilung: dasselbe fuer die Taupunktsteuerung.
  - id: ambientika_taupunktsteuerung_neustart
    alias: "Ambientika NeuraCell-X – Taupunktsteuerung automatisch neu starten"
    mode: single
    trace:
      stored_traces: 25
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_dew_point_controller_connected
        to: "off"
        for: "00:10:00"
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.ambientika_neustart_taupunkt
        state: "on"
      - condition: template
        value_template: "{{ has_value('binary_sensor.neuracell_x_dew_point_controller_connected') }}"
      - condition: state
        entity_id: binary_sensor.neuracell_x_dew_point_controller_connected
        state: "off"
        for: "00:09:30"
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 3540 }}
    action:
      - service: script.ambientika_geraet_neu_starten
        data:
          geraet: taupunkt
          automatisch: true

  # Selbstheilung: Waechter. Bleibt eine Steckdose laenger als 2 Minuten aus
  # (z. B. Neustart von Home Assistant mitten im Schaltvorgang), schaltet er sie
  # wieder ein - solange der Schalter "automatisch neu starten" an ist.
  - id: ambientika_steckdosen_waechter
    alias: "Ambientika NeuraCell-X – Steckdose wieder einschalten"
    mode: parallel
    trigger:
      - platform: state
        entity_id: *steckdose_radon
        to: "off"
        for: "00:02:00"
        id: radon
      - platform: state
        entity_id: *steckdose_taupunkt
        to: "off"
        for: "00:02:00"
        id: taupunkt
    condition:
      - condition: template
        value_template: "{{ is_state('input_boolean.ambientika_neustart_' ~ trigger.id, 'on') }}"
    action:
      - service: homeassistant.turn_on
        target:
          entity_id: "{{ trigger.entity_id }}"
      - service: persistent_notification.create
        data:
          notification_id: "ambientika_steckdose_{{ trigger.id }}"
          title: "Ambientika Selbstheilung"
          message: >-
            Die Steckdose {{ trigger.entity_id }} war länger als 2 Minuten aus und
            wurde wieder eingeschaltet. Zum Warten zuerst den Schalter
            "automatisch neu starten" ausschalten.

  # Selbstheilung: Zaehler um Mitternacht auf null - oder beim ersten Start von
  # Home Assistant an einem neuen Tag, falls es um Mitternacht nicht lief.
  - id: ambientika_neustart_zaehler_reset
    alias: "Ambientika NeuraCell-X – Neustart-Zähler zurücksetzen"
    mode: single
    trigger:
      - platform: time
        at: "00:00:00"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ states('input_datetime.ambientika_neustart_zaehler_datum') != now().date() | string }}"
    action:
      - service: counter.reset
        target:
          entity_id:
            - counter.ambientika_neustarts_radon
            - counter.ambientika_neustarts_taupunkt
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ambientika_neustart_zaehler_datum
        data:
          date: "{{ now().date() }}"

  # Hinweis aufs Handy, wenn der Radonschutz anspringt bzw. endet.
  - id: ambientika_radon_hinweis
    alias: "Ambientika NeuraCell-X – Radonschutz Hinweis"
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_protection_active
        from: "off"
        to: "on"
        id: "an"
      - platform: state
        entity_id: binary_sensor.neuracell_x_radon_protection_active
        from: "on"
        to: "off"
        id: "aus"
    action:
      - service: notify.notify
        data:
          title: "NeuraCell-X"
          message: >
            {% if trigger.id == 'an' %}
            Radonschutz aktiv ({{ states('sensor.neuracell_x_radon_level') }} Bq/m³) – alle Geräte laufen in Zuluft.
            {% else %}
            Radonwert wieder im grünen Bereich – Lüftung läuft wie vorher.
            {% endif %}
