services:
  ambientika-bridge:
    # The published image (amd64 and arm64). "docker compose pull" fetches a
    # newer version; "docker compose up -d --build" builds the image from
    # this folder instead.
    image: ghcr.io/ambientika-eu/ambientika-mqtt-bridge:latest
    build: .
    restart: unless-stopped
    # Either fill in ./config.yaml (see config.example.yaml) or set these in .env
    # (see .env.example); a variable set here overrides the YAML value. Only the
    # variables listed here reach the container - for anything else use
    # config.yaml or add the variable to this list.
    environment:
      - AMBIENTIKA_USER=${AMBIENTIKA_USER:-}
      - AMBIENTIKA_PASS=${AMBIENTIKA_PASS:-}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - SLAVE_FILTER_SOFT_RESET=${SLAVE_FILTER_SOFT_RESET:-0}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - bridge_data:/data
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  bridge_data:
  mosquitto_data:
  mosquitto_log:
