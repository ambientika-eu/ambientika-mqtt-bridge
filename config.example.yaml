ambientika:
  username: "ihre@email.de"
  password: "ihrpasswort"
  host: "https://app.ambientika.eu:4521"

mqtt:
  host: "localhost"
  port: 1883
  # MQTT credentials are required for most brokers (e.g. the official
  # Home Assistant Mosquitto add-on disables anonymous access by default).
  # Only leave these empty if your broker explicitly allows anonymous
  # connections.
  username: ""
  password: ""
  tls: false

bridge:
  topic_prefix: "ambientika"
  discovery_prefix: "homeassistant"
  enable_discovery: true
  poll_interval: 30
  # Consecutive failed polls before a device is flagged offline in MQTT.
  # 1 = flag offline on the first miss (old behaviour).
  availability_failure_threshold: 3
  log_level: "INFO"

# --- NeuraCell-X radon protection ---
# Radon alarm -> all devices Intake (Zuluft/supply) at fan Low (Stufe 1).
neuracell:
  neuracell_enabled: true
  radon_topic: "ambientika/radon/value"       # numeric Bq/m3
  radon_alarm_topic: "ambientika/radon/alarm"  # explicit ON/OFF ("none" = off)
  # Ambientika radon meter in MQTT mode 4 publishes {"mittelwert": <Bq/m3>} on
  # radon/<meter-id>/state - read directly ("none" = off). With several sources
  # the highest current value decides.
  radon_meter_topic: "radon/+/state"
  radon_value_key: "mittelwert"                 # JSON key of the radon value
  # Minutes without any message from the meter (value or availability) before it
  # counts as disconnected - also after a bridge restart while it is already gone
  # (the meters seen so far are remembered on the broker). Its Last Will still
  # counts at once. 0 = Last Will only.
  radon_meter_timeout: 30
  radon_threshold: 300                          # Bq/m3 (DE reference value; WHO = 100)
  radon_hysteresis: 50                          # Bq/m3
  radon_protection_fan: "Low"
  radon_source: "signal"                        # "signal" (MQTT topics above) or "device"
  # device source (no hardware): read a radon meter's status directly from the
  # Ambientika cloud. Set radon_source: "device", give the meter's serial (see
  # add-on log), and pick the status field that carries its alarm/level.
  radon_device_serial: ""
  # Numeric fields (e.g. a Bq/m3 value) are compared to radon_threshold above.
  # String fields (e.g. air_quality) trigger an alarm when their value is one of
  # radon_device_alarm_values. Boolean fields are used directly.
  radon_device_alarm_field: "air_quality"
  radon_device_alarm_values: "Bad,Poor,Very Bad,Alarm,Alert"

# --- Dew-point control (Taupunktsteuerung) - radon has priority ---
# "Not ideal to ventilate" -> all devices Off; good conditions -> release/restore.
dewpoint:
  dewpoint_enabled: true
  dewpoint_source: "signal"                     # "signal", "computed" or "device"
  # signal source (external ON/OFF; truthy = block ventilation):
  dewpoint_block_topic: "ambientika/dewpoint/block"
  dewpoint_block_key: ""                        # JSON key if the payload is a JSON object
  # Limit the block to specific units (device name or serial, comma-separated).
  # Empty = all units. Example for two named units: "SMART,OFFICE".
  dewpoint_block_devices: ""
  # device source (no hardware): read a TPS device's status from the Ambientika
  # cloud. Set dewpoint_source: "device", give the TPS serial (see add-on log),
  # and block when its operating mode is one of dewpoint_device_block_modes.
  dewpoint_device_serial: ""
  dewpoint_device_block_modes: "Off"
  # computed source (bridge computes dew points from these four topics):
  dewpoint_indoor_temp_topic: "ambientika/dewpoint/indoor_temp"
  dewpoint_indoor_humidity_topic: "ambientika/dewpoint/indoor_humidity"
  dewpoint_outdoor_temp_topic: "ambientika/dewpoint/outdoor_temp"
  dewpoint_outdoor_humidity_topic: "ambientika/dewpoint/outdoor_humidity"
  dewpoint_margin: 1.0                          # °C
  dewpoint_hysteresis: 0.5                      # °C
  # Connection watch for the Taupunktsteuerung (TPS). A TPS that hangs stops
  # sending; without a watch its last block state would stay in force unnoticed.
  # The HA sensor "Dew Point Controller Connected" shows the result.
  dewpoint_availability_topic: ""   # its availability topic with Last Will (online/offline); "" = off (not needed for the Ambientika Taupunktsteuerung, see below)
  dewpoint_signal_timeout: 0        # minutes without any TPS message -> disconnected; 0 = off (only without Last Will; pauses while the bridge is off the broker)
  dewpoint_lost_action: "keep"      # when disconnected: "keep" | "release" (ventilate) | "block" (units off)
  # Ambientika Taupunktsteuerung (MQTT firmware) read directly: dew-point/<id>/state
  # carries {"ventilating": true|false, "reason": ...} - ventilating false = block.
  # Its Last Will (dew-point/<id>/availability/state) and its sensor messages
  # (dew-point/<id>/sensors) are watched automatically. "none" = off (as an
  # environment variable use DEWPOINT_CONTROLLER_TOPIC=off).
  dewpoint_controller_topic: "dew-point/+/state"
  dewpoint_controller_key: "ventilating"
