name: Smoke test (build + import check + run)

# Builds all three Docker images, verifies that the ambientika_py library,
# including the LightSensorLevel class, can be imported (this catches the
# class of error reported in issue #1 before it can reach end users), and
# then runs each image for real: against a local stand-in for the Ambientika
# cloud (sim/fake_cloud.py) and a real Mosquitto broker, driven by
# test_system_sim.py - start, discovery, values, commands, filter reset,
# broker restart, clean stop, Last Will, configuration.
#
# Note: ha-addon and ambientika_mqtt_bridge use the Home Assistant
# add-on build convention with ARG BUILD_FROM. In a real HA install
# the Supervisor takes the base image from build.yaml. For the smoke
# test we pass the amd64 image named there. The add-on images are
# started the way the Supervisor starts them: with /data/options.json
# and run.sh.

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/build.yaml"
      - "**/config.yaml"
      - "**/run.sh"
      - "**/requirements.txt"
      - "**/*.py"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/build.yaml"
      - "**/config.yaml"
      - "**/run.sh"
      - "**/requirements.txt"
      - "**/*.py"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-import:
    name: Build & import check (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: root (Debian)
            dockerfile: Dockerfile
            context: .
            tag: ambientika-bridge:root
            build_args: |
              BUILD_VERSION=ci
            sim: --image
          - name: ha-addon (Alpine)
            dockerfile: ha-addon/Dockerfile
            context: ha-addon
            tag: ambientika-bridge:ha-addon
            build_args: |
              BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
              BUILD_VERSION=ci
              BUILD_ARCH=amd64
            sim: --addon-image
          - name: ambientika_mqtt_bridge slug (Alpine)
            dockerfile: ambientika_mqtt_bridge/Dockerfile
            context: ambientika_mqtt_bridge
            tag: ambientika-bridge:slug
            build_args: |
              BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
              BUILD_VERSION=ci
              BUILD_ARCH=amd64
            sim: --addon-image

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (${{ matrix.image.name }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image.tag }}
          build-args: ${{ matrix.image.build_args }}

      - name: Import check - LightSensorLevel and friends
        run: |
          docker run --rm --entrypoint python "${{ matrix.image.tag }}" -c "
          import sys
          print('Python:', sys.version)

          # The original bug: this import must succeed.
          from ambientika_py import LightSensorLevel
          print('OK: LightSensorLevel =', LightSensorLevel)

          # Verify other runtime deps used by bridge.py resolve too.
          import paho.mqtt.client
          import yaml
          import aiohttp
          import returns
          print('OK: paho.mqtt, yaml, aiohttp, returns all importable')
          "

      - name: Setup Python (test driver)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mosquitto and the test driver's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto || true
          # Ubuntu confines /usr/sbin/mosquitto to /etc/mosquitto and its data
          # folders; the tests start brokers with their own configuration.
          sudo cp /usr/sbin/mosquitto /usr/local/bin/mosquitto-test
          echo "SIM_MOSQUITTO=/usr/local/bin/mosquitto-test" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The groups hang and startfail belong to the request time limit of the
      # bridge and are run by the functional test once that is in.
      - name: Run the image against the cloud stand-in and a real broker
        run: python test_system_sim.py ${{ matrix.image.sim }} "${{ matrix.image.tag }}" --only start,commands,broker,config
