name: Publish homebridge-ambientika to npm

# Trigger: only when a homebridge-plugin version tag is pushed (e.g. homebridge-v1.0.1)
# Bridge releases (v*) do NOT trigger this workflow.
on:
  push:
    tags:
      - "homebridge-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homebridge-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Trusted Publishing (OIDC): no NPM_TOKEN secret needed.
      # npmjs.com -> homebridge-ambientika -> Settings -> Trusted Publisher:
      #   GitHub Actions, ambientika-eu / ambientika-mqtt-bridge, workflow publish-npm.yml
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Update npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Package: $NAME@$VERSION"

      - name: Check if version already published on npm
        id: check
        run: |
          NAME='${{ steps.pkg.outputs.name }}'
          VERSION='${{ steps.pkg.outputs.version }}'
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "Version $NAME@$VERSION already exists on npm. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $NAME@$VERSION is new. Will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm install

      - name: Verify package
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --dry-run

      - name: Publish to npm (OIDC, provenance is added automatically)
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
